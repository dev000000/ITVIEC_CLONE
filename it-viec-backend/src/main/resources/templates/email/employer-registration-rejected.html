<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Thông báo đăng ký nhà tuyển dụng NHIEUviec</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f7fa; font-family:Arial,Helvetica,sans-serif; -webkit-font-smoothing:antialiased;">

  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f7fa; padding:40px 16px;">
    <tr>
      <td align="center">

        <table width="600" cellpadding="0" cellspacing="0" border="0"
               style="background:#ffffff; border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,0.08); overflow:hidden; max-width:600px; width:100%;">

          <tr>
            <td style="background:#ed1b2f; padding:28px 40px; text-align:center;">
              <h1 style="color:#ffffff; margin:0; font-size:28px; font-weight:700; letter-spacing:1px;">NHIEUviec</h1>
              <p style="color:rgba(255,255,255,0.85); margin:6px 0 0; font-size:13px;">nhiều việc tốt, nơi tài năng tỏa sáng</p>
            </td>
          </tr>

          <tr>
            <td style="padding:36px 40px 28px;">
              <h2 style="color:#1a1a2e; margin:0 0 16px; font-size:22px; font-weight:600;">
                Xin chào, <span th:text="${name}" style="color:#ed1b2f;">User</span>
              </h2>
              <p style="color:#555; line-height:1.7; margin:0 0 12px; font-size:15px;">
                Rất tiếc, đăng ký nhà tuyển dụng của bạn chưa được phê duyệt.
              </p>
              <p th:if="${reason != null and !#strings.isEmpty(reason)}"
                 style="color:#555; line-height:1.7; margin:0 0 12px; font-size:15px;">
                <span th:text="${reason}">Lý do</span>
              </p>
              <p style="color:#555; line-height:1.7; margin:0 0 28px; font-size:15px;">
                Vui lòng liên hệ <a href="mailto:support@nhieuviec.com" style="color:#1890ff;">support@nhieuviec.com</a>
                nếu bạn cần hỗ trợ thêm.
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding:0 40px;">
              <hr style="border:none; border-top:1px solid #eef0f3; margin:0;"/>
            </td>
          </tr>

          <tr>
            <td style="padding:20px 40px 28px;">
              <p style="color:#ccc; font-size:11px; margin:0;">
                © 2024 NHIEUviec. Mọi quyền được bảo lưu.
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
